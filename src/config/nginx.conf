# HappyLab test web server. Runs inside hl-server as the normal user (not root):
#   nginx -p <prefix> -c <this file> -e <prefix>/logs/error.log
# Relative paths below are under the prefix (data/generated/nginx/ by convention).
# Listens only on hl-server's v4 and v6 link addresses, never on the ctl link or the host.

daemon off;
worker_processes 1;
pid nginx.pid;
error_log logs/error.log info;

events {
    worker_connections 64;
}

http {
    # Times in seconds with ms resolution; $connection ties lines to TCP connections.
    log_format hl '$msec $server_addr $remote_addr:$remote_port conn=$connection '
                  '"$request" $status $body_bytes_sent';
    access_log logs/access.log hl;

    client_body_temp_path tmp/client_body;
    proxy_temp_path       tmp/proxy;
    fastcgi_temp_path     tmp/fastcgi;
    uwsgi_temp_path       tmp/uwsgi;
    scgi_temp_path        tmp/scgi;

    server_tokens off;
    default_type text/plain;
    keepalive_timeout 0;   # keep-alive off: one request per connection, server sends Connection: close

    server {
        listen 192.0.2.2:80;
        listen [2001:db8:28:6::2]:80;
        server_name www.hl.test;

        location / {
            return 200 "HappyLab\n";
        }

        # Page for Chromium runs. The data: icon stops the automatic /favicon.ico request,
        # which (with keep-alive off) would open a second data-carrying connection and make
        # every run's winning connection ambiguous.
        location = /chromium.html {
            default_type text/html;
            return 200 '<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>HappyLab</title></head><body>HappyLab</body></html>\n';
        }
    }
}
